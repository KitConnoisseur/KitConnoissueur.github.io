<!DOCTYPE html>
<html>
<head>
  <title>Kit Connoisseur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { padding: 20px; text-align: center; background: #111; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
    .item { border: 1px solid #ddd; padding: 10px; text-align: center; }
    img { max-width: 100%; }
    footer { text-align: center; padding: 20px; font-size: 14px; color: #555; }
      .product {
    max-width: 420px;
    margin: 0 auto;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

 .gallery img {
  width: 100%;
  border-radius: 6px;
  border: 1px solid #ddd;
  cursor: zoom-in;
  transition: transform 0.2s;
}
.gallery img:hover {
  transform: scale(1.03);
}

  </style>
</head>
<body>

<header>
  <h1>Kit Connoisseur</h1>
  <p>Authentic vintage & modern football shirts • UK</p>
</header>

<div class="grid">
  <div class="item product">
    
  <div class="gallery">
  <a href="psg-front.jpg" target="_blank">
    <img src="psg-front.jpg" alt="PSG Noir Front">
  </a>
  <a href="psg-back.jpg" target="_blank">
    <img src="psg-back.jpg" alt="PSG Noir Back">
  </a>
  <a href="psg-badge.jpg" target="_blank">
    <img src="psg-badge.jpg" alt="PSG Badge Detail">
  </a>
  <a href="psg-tag.jpg" target="_blank">
    <img src="psg-tag.jpg" alt="PSG Tag Detail">
  </a>
</div>


    <h3>PSG Noir Shirt</h3>
    <p>Authentic • Black / Purple</p>

  </div>
</div>



<footer>
  <p>All items are authentic originals.</p>
</footer>

</body>
</html>
